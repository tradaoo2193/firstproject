<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f2f2f2;
            flex-direction: column;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            gap: 20px;
        }
        .button {
            font-size: 1.5em;
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: all 0.3s ease;
        }
        .no-button {
            background-color: #f44336;
        }
    </style>
</head>
<body>
    <h1>Do you love me?</h1>
    <div class="button-container">
        <button class="button yes-button" onclick="handleYes()">Yes</button>
        <button class="button no-button" onclick="handleNo()">No</button>
    </div>

    <script>
        let noClickCount = 0;

        function handleYes() {
            alert('Yay! You love me!');
        }

        function handleNo() {
            noClickCount++;

            const yesButton = document.querySelector('.yes-button');
            const noButton = document.querySelector('.no-button');

            if (noClickCount === 1) {
                yesButton.style.fontSize = '2em'; // 25% bigger
                noButton.textContent = "If you say no, I will be very sad...";
            } else if (noClickCount === 2) {
                yesButton.style.width = '33%'; // Widen to 1/3 of the page
                noButton.textContent = "I will be very very sad...";
            } else if (noClickCount >= 3) {
                yesButton.style.width = '100%'; // Fullscreen
                yesButton.style.fontSize = '5em'; // Make the "Yes" button huge
                noButton.textContent = "Please don't break my heart!";
            }
        }
    </script>
</body>
</html>
