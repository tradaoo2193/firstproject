<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Do you love me?</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
      margin-top: 100px;
    }
    h1 {
      font-size: 2em;
    }
    .btn {
      padding: 10px 20px;
      font-size: 1em;
      margin: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #yesBtn {
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>Do you love me?</h1>
  <button id="yesBtn" class="btn">Yes</button>
  <button id="noBtn" class="btn">No</button>

  <script>
    let noClickCount = 0;
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('click', () => {
      noClickCount++;

      if (noClickCount === 1) {
        yesBtn.style.transform = 'scale(2)';
      } else if (noClickCount === 2) {
        yesBtn.style.transform = 'scale(4)';
      } else if (noClickCount === 3) {
        yesBtn.style.width = '50vw';
        yesBtn.style.height = '50vh';
        yesBtn.style.fontSize = '2em';
      } else if (noClickCount >= 4) {
        yesBtn.style.position = 'fixed';
        yesBtn.style.top = 0;
        yesBtn.style.left = 0;
        yesBtn.style.width = '100vw';
        yesBtn.style.height = '100vh';
        yesBtn.style.fontSize = '4em';
        yesBtn.innerText = "JUST SAY YES";
        noBtn.style.display = 'none';
        document.querySelector('h1').style.display = 'none';
      }
    });

    yesBtn.addEventListener('click', () => {
      alert("YAYYY!!! I KNEW IT =)))");
    });
  </script>
</body>
</html>
